name: Red-Team CI

# Runs whenever the system prompt or model config changes, plus manual
# runs from the Actions tab. Keeping the trigger narrow (not "every push")
# is deliberate: this job is slow (spins up a real local LLM), so it
# should only fire when there's actually something new to test.
#
# NOTE: the project lives inside the 01-ai-red-teaming-lab/ subfolder
# of this repo (not at the repo root), so every path below is prefixed
# with it.
on:
  push:
    paths:
      - "01-ai-red-teaming-lab/app/system_prompt.txt"
      - "01-ai-red-teaming-lab/app/config.yaml"
      - "01-ai-red-teaming-lab/redteam/promptfoo/promptfooconfig.yaml"
  pull_request:
    paths:
      - "01-ai-red-teaming-lab/app/system_prompt.txt"
      - "01-ai-red-teaming-lab/app/config.yaml"
      - "01-ai-red-teaming-lab/redteam/promptfoo/promptfooconfig.yaml"
  workflow_dispatch: {}

# Needed so the "Commit and push evidence" step at the end can push
# results/ back into the repository using the built-in token.
permissions:
  contents: write

jobs:
  redteam:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama server
        run: |
          nohup ollama serve > ollama.log 2>&1 &
          for i in {1..30}; do
            curl -sf http://localhost:11434 && break
            sleep 2
          done
      - name: Pull model
        run: ollama pull nemotron-mini

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install app dependencies
        working-directory: 01-ai-red-teaming-lab/app
        run: pip install -r requirements.txt

      - name: Start chatbot app
        working-directory: 01-ai-red-teaming-lab/app
        run: |
          nohup python main.py > app.log 2>&1 &
          echo "Waiting for chatbot app to become healthy..."
          for i in {1..30}; do
            if curl -sf http://localhost:8000/health; then
              echo "App is up."
              exit 0
            fi
            sleep 2
          done
          echo "App failed to start in time. Log output:"
          cat app.log
          exit 1
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # --- All three tools always run now, regardless of each other's
      # result. `continue-on-error: true` + a step `id` lets us check
      # each one's actual outcome afterward, in the "Evaluate overall
      # result" step below -- that's what still fails the job overall
      # when a real leak is found, without skipping the other tools'
      # evidence in the process.

      - name: Run Promptfoo red-team suite
        id: promptfoo
        continue-on-error: true
        working-directory: 01-ai-red-teaming-lab/redteam/promptfoo
        run: npx promptfoo eval --config promptfooconfig.yaml --output promptfoo-output.json

      - name: Install PyRIT
        run: pip install pyrit==1.0.1

      - name: Run PyRIT attack matrix
        id: pyrit
        continue-on-error: true
        working-directory: 01-ai-red-teaming-lab/redteam/pyrit
        # Tee to a log file as well as stdout, so this run's full output
        # can be saved as evidence, not just shown in the Actions console.
        run: python attack_matrix.py 2>&1 | tee pyrit-output.log

      # Garak remains informational only (known limitation: this probe
      # doesn't honor soft_probe_prompt_cap, so its run time is
      # unpredictable on a CPU-only runner) -- capped and non-blocking,
      # same as before.
      - name: Install Garak
        run: pip install garak

      - name: Run Garak (informational, non-blocking)
        working-directory: 01-ai-red-teaming-lab/redteam/garak
        timeout-minutes: 15
        continue-on-error: true
        run: |
          garak --target_type rest \
            --generator_option_file garak_config.json \
            --probes promptinject.HijackHateHumans \
            --parallel_attempts 4 \
            --generations 2
      # --- Final verdict --------------------------------------------------
      # This is the actual gate. Promptfoo and PyRIT both ran above no
      # matter what; this step is where we decide whether the overall
      # job passes or fails, based on what they actually found.
      - name: Evaluate overall red-team result
        id: verdict
        if: always()
        run: |
          echo "Promptfoo outcome: ${{ steps.promptfoo.outcome }}"
          echo "PyRIT outcome: ${{ steps.pyrit.outcome }}"
          if [ "${{ steps.promptfoo.outcome }}" != "success" ] || [ "${{ steps.pyrit.outcome }}" != "success" ]; then
            echo ""
            echo "RED-TEAM CI FAILED: at least one gate (Promptfoo and/or"
            echo "PyRIT) detected a leak. See that step's logs above for"
            echo "which prompt(s) caused it."
            echo "result=FAIL" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "All gates passed: no leaks detected."
          echo "result=PASS" >> "$GITHUB_OUTPUT"

      # --- Evidence capture -----------------------------------------------
      # Copies each tool's raw output into results/latest/ and commits it
      # back to the repo. Always runs (even after a failed gate above),
      # so a run that found a real leak still leaves proof behind instead
      # of only a temporary, expiring Actions artifact.
      - name: Collect evidence
        if: always()
        run: |
          mkdir -p 01-ai-red-teaming-lab/results/latest

          cp 01-ai-red-teaming-lab/redteam/promptfoo/promptfoo-output.json \
             01-ai-red-teaming-lab/results/latest/promptfoo-output.json 2>/dev/null || \
             echo "No Promptfoo output to copy."

          cp 01-ai-red-teaming-lab/redteam/pyrit/pyrit-output.log \
             01-ai-red-teaming-lab/results/latest/pyrit-output.log 2>/dev/null || \
             echo "No PyRIT output to copy."

          LATEST_GARAK=$(find ~/.local/share/garak/garak_runs -name "*.jsonl" 2>/dev/null | sort | tail -1)
          if [ -n "$LATEST_GARAK" ]; then
            cp "$LATEST_GARAK" 01-ai-red-teaming-lab/results/latest/garak-report.jsonl
          else
            echo "No Garak report found."
          fi

          cat > 01-ai-red-teaming-lab/results/latest/SUMMARY.md << EOF
          # Latest Red-Team CI Run

          - **Run:** ${{ github.run_id }} (${{ github.run_number }})
          - **Triggered by:** ${{ github.event_name }}
          - **Commit:** ${{ github.sha }}
          - **Date:** $(date -u +"%Y-%m-%d %H:%M UTC")
          - **Overall result:** ${{ steps.verdict.outputs.result }}
          - **Promptfoo outcome:** ${{ steps.promptfoo.outcome }}
          - **PyRIT outcome:** ${{ steps.pyrit.outcome }}

          Raw evidence in this folder is overwritten by each CI run.
          See docs/security-assessment.md for the written analysis.
          EOF

      - name: Commit and push evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 01-ai-red-teaming-lab/results/latest
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update red-team evidence from CI run ${{ github.run_number }}"
            git push
          fi

      - name: Upload Promptfoo results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promptfoo-results
          path: 01-ai-red-teaming-lab/redteam/promptfoo/promptfoo-output.json
          if-no-files-found: warn

      - name: Upload debug logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs
          path: |
            01-ai-red-teaming-lab/app/app.log
            ollama.log
