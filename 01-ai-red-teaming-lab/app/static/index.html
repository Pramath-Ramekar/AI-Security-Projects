<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Red-Team Lab Chatbot</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, sans-serif;
    background: #0f1115;
    color: #e6e6e6;
    margin: 0;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 14px 20px;
    background: #171a21;
    border-bottom: 1px solid #262a33;
  }
  header h1 { font-size: 16px; margin: 0; }
  header p { font-size: 12px; color: #8a8f98; margin: 4px 0 0; }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 70%;
    padding: 10px 14px;
    border-radius: 10px;
    line-height: 1.4;
    font-size: 14px;
    white-space: pre-wrap;
  }
  .user {
    align-self: flex-end;
    background: #2b5fff;
    color: white;
  }
  .bot {
    align-self: flex-start;
    background: #1e222b;
    border: 1px solid #2a2f3a;
  }
  .bot.error { border-color: #a33; color: #ff8a8a; }
  #inputRow {
    display: flex;
    padding: 14px;
    gap: 8px;
    background: #171a21;
    border-top: 1px solid #262a33;
  }
  #inputRow input {
    flex: 1;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #2a2f3a;
    background: #0f1115;
    color: #e6e6e6;
    font-size: 14px;
  }
  #inputRow button {
    padding: 10px 18px;
    border-radius: 8px;
    border: none;
    background: #2b5fff;
    color: white;
    font-size: 14px;
    cursor: pointer;
  }
  #inputRow button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>

<header>
  <h1>Red-Team Lab Chatbot</h1>
  <p>Talks to your FastAPI /chat endpoint → Ollama. Try normal messages, then jailbreak attempts.</p>
</header>

<div id="messages"></div>

<div id="inputRow">
  <input id="input" type="text" placeholder="Type a message..." autofocus />
  <button id="send">Send</button>
</div>

<script>
  const messagesEl = document.getElementById("messages");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("send");

  function addMessage(text, sender, isError = false) {
    const div = document.createElement("div");
    div.className = `msg ${sender}${isError ? " error" : ""}`;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    addMessage(text, "user");
    inputEl.value = "";
    sendBtn.disabled = true;

    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text }),
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        addMessage(`Error ${res.status}: ${err.detail || res.statusText}`, "bot", true);
        return;
      }

      const data = await res.json();
      addMessage(data.response, "bot");
    } catch (e) {
      addMessage(`Request failed: ${e.message}`, "bot", true);
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendMessage();
  });
</script>

</body>
</html>
